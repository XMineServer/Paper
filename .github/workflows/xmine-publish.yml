# Публикация ядра XMine в свой Reposilite.
#
# ЭТОТ РЕПОЗИТОРИЙ ПУБЛИЧНЫЙ, поэтому `runs-on` здесь — только раннеры GitHub и
# никогда `self-hosted`. Правило записано в вики (infra/ci.md, «Граница
# безопасности: только приватные репозитории») и `Paper` в нём назван поимённо:
# 17.08.2026 его убрали из группы раннеров `xmine-ci`. Причина в том, что PR из
# чужого форка исполняет workflow ИЗ САМОГО PR, то есть автор форка волен
# дописать `runs-on: self-hosted` и получить исполнение своего кода на хосте, где
# работает игровой сервер.
#
# Отсюда же остальные меры: триггера `pull_request` нет вовсе, push ограничен
# нашими ветками, а job не запускается в форках самого форка.

name: XMine - publish core

on:
  push:
    branches: ['xmine/**']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish an immutable release instead of a snapshot'
        type: boolean
        default: false

# Публикация не должна идти в два потока: снапшот перезаписывается, и параллельные
# сборки означали бы гонку за то, чья попадёт под плавающую координату.
concurrency:
  group: xmine-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Форки самого форка не должны пытаться публиковать в наш Reposilite.
    if: github.repository == 'XMineServer/Paper'
    runs-on: ubuntu-latest

    env:
      XMINE_MAVEN_USERNAME: ${{ secrets.XMINE_MAVEN_USERNAME }}
      XMINE_MAVEN_PASSWORD: ${{ secrets.XMINE_MAVEN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          # applyPatches работает с историей, на мелком клоне он не отработает.
          fetch-depth: 0

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decide version
        id: version
        run: |
          # BUILD_NUMBER задан -> релиз 26.1.2-xmine.<N> в раздел releases.
          # Не задан -> 26.1.2-xmine-SNAPSHOT в snapshots. Логика в
          # settings.gradle.kts, здесь только выбор режима и номера.
          set -eu
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] \
             || [ "${{ inputs.release }}" != "true" ]; then
            echo "kind=snapshot" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Номер СЧИТАЕТСЯ ИЗ УЖЕ ОПУБЛИКОВАННОГО, а не из github.run_number.
          #
          # run_number растёт на каждом прогоне этого файла - и на снапшотных, и
          # на упавших, - поэтому дал бы дырки в нумерации релизов. А так номер
          # означает ровно «N-й выпущенный релиз этой версии Minecraft», и
          # пропуск невозможен по построению: источник истины - сам репозиторий,
          # где версии и лежат.
          #
          # Нумерация своя у каждой версии Minecraft: у 26.1.3 отсчёт начнётся
          # заново с 1.
          MC="$(sed -n 's/^mcVersion=//p' gradle.properties | tr -d '[:space:]')"
          echo "Minecraft version: $MC"

          NEXT="$(python3 - "$MC" <<'PY'
          import re, sys, urllib.error, urllib.request
          import xml.etree.ElementTree as ET

          BASE = "https://maven.xmine.world/releases/io/papermc/paper/paperclip"
          mc = sys.argv[1]
          try:
              with urllib.request.urlopen(f"{BASE}/maven-metadata.xml", timeout=30) as response:
                  meta = response.read()
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              meta = None          # ни одного релиза ещё нет
          if meta is None:
              print(1)
              sys.exit(0)

          pattern = re.compile(rf"^{re.escape(mc)}-xmine\.(\d+)$")
          numbers = [
              int(m.group(1))
              for v in ET.fromstring(meta).findall("./versioning/versions/version")
              if (m := pattern.match((v.text or "").strip()))
          ]
          print(max(numbers, default=0) + 1)
          PY
          )"

          echo "BUILD_NUMBER=$NEXT" >> "$GITHUB_ENV"
          echo "kind=release" >> "$GITHUB_OUTPUT"
          echo "Next release build number: $NEXT"

      - name: Fail early without credentials
        run: |
          # Без учётки сборка дошла бы до конца и упала на последнем шаге, потратив
          # десятки минут на applyPatches. Дешевле проверить сразу.
          if [ -z "${XMINE_MAVEN_USERNAME:-}" ] || [ -z "${XMINE_MAVEN_PASSWORD:-}" ]; then
            echo "::error::Secrets XMINE_MAVEN_USERNAME / XMINE_MAVEN_PASSWORD are not set"
            exit 1
          fi

      - name: Apply patches
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"
          ./gradlew applyPatches --stacktrace

      - name: Test
        # Свои правки живут в paper-api (подстановка env в YamlConfiguration), и
        # их тесты - единственное, что отделяет сломанное ядро от публикации.
        run: ./gradlew :paper-api:test --stacktrace

      - name: Publish paperclip
        run: ./gradlew :paper-server:publishPaperclipPublicationToXmineRepository --stacktrace

      - name: Report coordinate
        run: |
          VERSION="$(./gradlew -q printPaperVersion | tail -1)"
          echo "### Published ${{ steps.version.outputs.kind }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "io.papermc.paper:paperclip:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
